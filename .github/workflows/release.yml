# Builds TableCross for macOS, Windows and Linux.
#
# - Push of a tag `v<version>` (matching `version` in Cargo.toml): a release under that tag. It is
#   never replaced; for changes raise the version and tag again.
# - Every push to main: the test build (pre-release under the tag `testing`), replaced each time.
# - By hand under "Actions → Release → Run workflow": artifacts only, no release.

name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # The app tells releases from test builds (update check, about page)
  TC_CHANNEL: ${{ startsWith(github.ref, 'refs/tags/v') && 'release' || 'test' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            name: macOS
          - os: windows-latest
            name: Windows
          # Older Ubuntu, so the program also runs on older distributions (glibc 2.35)
          - os: ubuntu-22.04
            name: Linux
            arch: x86_64
          # ARM64, e.g. Raspberry Pi 4/5 with 64-bit Raspberry Pi OS (Bookworm has glibc 2.36)
          - os: ubuntu-22.04-arm
            name: Linux-arm64
            arch: arm64
          # 32-bit PCs (e.g. netbooks with an Atom CPU), cross-built on the 64-bit runner
          - os: ubuntu-22.04
            name: Linux-i686
            arch: i686
            target: i686-unknown-linux-gnu
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.target || '' }}

      - uses: Swatinem/rust-cache@v2

      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev \
            libxrandr-dev libxi-dev libgl1-mesa-dev pkg-config
          # The C parts (ring) for 32 bits; the system libraries are loaded at run time
          if [ -n "${{ matrix.target }}" ]; then sudo apt-get install -y gcc-multilib; fi

      - name: Tests
        shell: bash
        run: cargo test --workspace --release ${{ matrix.target && format('--target {0}', matrix.target) || '' }}

      - name: Licenses of the libraries
        shell: bash
        run: |
          cargo install cargo-bundle-licenses --locked
          cargo bundle-licenses --format yaml --output THIRD-PARTY-LICENSES.yml

      - name: Version
        id: version
        shell: bash
        run: echo "version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

      # One universal app (Apple silicon and Intel). Signed with the project's own certificate
      # (secrets MACOS_SIGN_P12 as base64 and MACOS_SIGN_PASSWORD), so permissions survive updates;
      # without the secrets ad-hoc.
      - name: macOS
        if: matrix.name == 'macOS'
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          TC_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
        run: |
          if [ -n "$MACOS_SIGN_P12" ]; then
            echo "$MACOS_SIGN_P12" | base64 --decode > "$RUNNER_TEMP/sign.p12"
            eval "$(scripts/signing-keychain.sh "$RUNNER_TEMP/sign.p12" "$RUNNER_TEMP/sign.keychain-db")"
            rm "$RUNNER_TEMP/sign.p12"
          else
            echo "::warning::no signing certificate, the app is signed ad-hoc"
          fi
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --target $t -p tablecross -p tablecross-helper -p tablecross-cli
          done
          mkdir -p target/release
          for b in tablecross tablecross-helper tablecross-cli; do
            lipo -create -output target/release/$b \
              target/aarch64-apple-darwin/release/$b target/x86_64-apple-darwin/release/$b
          done
          TC_SKIP_BUILD=1 scripts/bundle-macos.sh
          mkdir -p pkg
          V="${{ steps.version.outputs.version }}"
          cp README.md LICENSE THIRD-PARTY-LICENSES.yml assets/fonts/*-LICENSE.txt dist/
          ditto -c -k --keepParent dist/TableCross.app "pkg/TableCross-$V-macOS.zip"
          (cd dist && zip -q "../pkg/TableCross-$V-macOS.zip" README.md LICENSE THIRD-PARTY-LICENSES.yml *-LICENSE.txt)
          scripts/make-dmg.sh "pkg/TableCross-$V-macOS.dmg"

      - name: Windows
        if: matrix.name == 'Windows'
        shell: bash
        run: |
          cargo build --release -p tablecross -p tablecross-cli -p tablecross-service
          cp THIRD-PARTY-LICENSES.yml target/release/
          V="${{ steps.version.outputs.version }}"
          "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" -Q "-DVersion=$V" "-DSource=$PWD/target/release" \
            "-O$PWD/pkg" packaging/windows/tablecross.iss
          DIR="TableCross-$V-Windows-portable"
          mkdir -p "pkg/$DIR"
          cp target/release/tablecross.exe "pkg/$DIR/TableCross.exe"
          cp target/release/tablecross-cli.exe target/release/tablecross-service.exe "pkg/$DIR/"
          cp README.md LICENSE THIRD-PARTY-LICENSES.yml assets/fonts/*-LICENSE.txt "pkg/$DIR/"
          cd pkg && 7z a -tzip "$DIR.zip" "$DIR" > /dev/null && rm -r "$DIR"

      - name: Linux
        if: runner.os == 'Linux'
        run: |
          T="${{ matrix.target }}"
          cargo build --release -p tablecross -p tablecross-cli ${T:+--target $T}
          OUT="target/${T:+$T/}release"
          V="${{ steps.version.outputs.version }}"
          DIR="TableCross-$V-Linux-${{ matrix.arch }}"
          mkdir -p "pkg/$DIR"
          cp "$OUT/tablecross" "$OUT/tablecross-cli" assets/tablecross.desktop \
            README.md LICENSE THIRD-PARTY-LICENSES.yml assets/fonts/*-LICENSE.txt "pkg/$DIR/"
          cp assets/icon-256.png "pkg/$DIR/tablecross.png"
          cp scripts/install-linux.sh "pkg/$DIR/install.sh"
          cd pkg && tar czf "$DIR.tar.gz" "$DIR" && rm -r "$DIR"

      - uses: actions/upload-artifact@v4
        with:
          name: TableCross-${{ matrix.name }}
          path: pkg/*

  release:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: version
        run: |
          V=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$V" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $V in Cargo.toml"
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          path: pkg
          merge-multiple: true

      - name: Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: TableCross ${{ steps.version.outputs.version }}
          prerelease: false
          make_latest: true
          body: |
            TableCross ${{ steps.version.outputs.version }} for macOS (Apple silicon and Intel, one universal app), Windows (64-bit) and Linux (x86_64, arm64, e.g. Raspberry Pi 4/5 with 64-bit Raspberry Pi OS, and 32-bit i686).

            **macOS:** open the `.dmg` and drag TableCross to Applications. On first start macOS refuses it once: click Done, then System Settings → Privacy & Security → **Open Anyway**. Or install from Terminal without that step:
            ```
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/scripts/install-macos.sh | bash
            ```

            **Windows:** run `TableCross-…-Windows-Setup.exe` (on a SmartScreen warning: More info → Run anyway). **Linux:** unpack the `.tar.gz` and run `./install.sh`.

            Already installed? Use **Update now** in the app. Installation notes are in the README.
          files: pkg/*

      # The test build: remove the previous one with its tag, so the tag points at the new commit
      - name: Remove the previous test build
        if: github.ref_type == 'branch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete testing --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" || true
      - name: Test build
        if: github.ref_type == 'branch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: testing
          target_commitish: ${{ github.sha }}
          name: TableCross test build (${{ steps.version.outputs.version }}, ${{ github.sha }})
          prerelease: true
          make_latest: false
          body: |
            **Test build** with the files below, made from the newest state of `main` (commit ${{ github.sha }}). It is replaced with every change and may have rough edges.

            For everyday use, take the release marked **Latest** above instead.
          files: pkg/*
