# Tests, Clippy and formatting on every push and pull request, on all three platforms,
# plus license and security checks of the dependencies (cargo-deny).
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Linux libraries for the window
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev \
            libxrandr-dev libxi-dev libgl1-mesa-dev pkg-config
      - name: Formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # App, test tool, macOS system helper and Windows service for trying it on real computers
      - name: Build the programs
        run: cargo build --release -p tablecross -p tablecross-cli -p tablecross-helper -p tablecross-service
      - uses: actions/upload-artifact@v4
        with:
          name: tablecross-${{ runner.os }}
          path: |
            target/release/tablecross
            target/release/tablecross.exe
            target/release/tablecross-cli
            target/release/tablecross-cli.exe
            target/release/tablecross-helper
            target/release/tablecross-service.exe
          if-no-files-found: error

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
