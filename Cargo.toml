[workspace]
resolver = "3"
members = ["crates/protocol", "crates/core", "crates/clipboard", "crates/input", "crates/net", "crates/session", "cli", "app", "helper/macos", "helper/windows", "tools/secure-input-probe"]

[workspace.package]
version = "0.4.73"
edition = "2024"
license = "GPL-3.0-or-later"
authors = ["Markus Eckert <eckert_@gmx.de>"]
repository = "https://github.com/eckonator/tablecross"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", default-features = false, features = ["use-std"] }
